[package]
name = "leakscan"
version = "0.1.0"
edition = "2021"
description = "Find what you are about to send along with a file: hidden metadata, tracked changes, personal data"
license = "MIT"
repository = "https://github.com/dkautomation23/leakscan"

[dependencies]
zip = { version = "2", default-features = false, features = ["deflate"] }
quick-xml = "0.36"
regex = "1"
kamadak-exif = "0.6"
lopdf = { version = "0.34", default-features = false, features = ["nom_parser"] }
walkdir = "2"
rayon = "1"
clap = { version = "4", features = ["derive"] }

[profile.release]
opt-level = 3
lto = true
strip = true
